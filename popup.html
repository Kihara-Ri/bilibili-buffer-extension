<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bili 缓冲站</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand-lockup">
          <img class="brand-icon" src="assets/icon-48.png" alt="">
          <h1>Bili 缓冲站</h1>
        </div>
      </header>

      <nav id="panel-tabs" class="panel-tabs" role="tablist" aria-label="插件面板">
        <button id="cache-tab" type="button" role="tab" data-panel-view="cache" aria-controls="cache-view" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>缓存</span>
        </button>
        <button id="assist-tab" type="button" role="tab" data-panel-view="assist" aria-controls="assist-view" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v3m4-7v7m4-11v11m4-14v14m4-9v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>播放</span>
          <span id="assist-tab-indicator" class="tab-indicator" aria-hidden="true"></span>
        </button>
        <button id="library-tab" type="button" role="tab" data-panel-view="library" aria-controls="library-view" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v13H5zM8.5 5.5v13M12 9h4m-4 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>片库</span>
          <span id="library-count" class="tab-count">0</span>
        </button>
      </nav>

      <div class="panel-stack">
        <section id="cache-view" class="panel-view" role="tabpanel" aria-labelledby="cache-tab">
          <section class="current-video" aria-labelledby="current-heading">
            <div class="section-heading">
              <div>
                <p class="section-kicker">当前视频</p>
                <h2 id="current-heading">正在识别视频</h2>
              </div>
              <span id="page-mark" class="page-mark" hidden></span>
            </div>
            <p id="current-detail" class="current-detail">
              <a id="current-owner" class="current-owner" href="#" hidden></a>
              <span id="current-detail-separator" hidden> · </span>
              <span id="current-detail-text">请稍候…</span>
            </p>

            <div id="format-controls" class="format-controls" hidden>
              <div id="quality-row" class="quality-row" hidden>
                <span class="quality-label">画质</span>
                <div id="quality-picker" class="quality-picker">
                  <button
                    id="quality-trigger"
                    class="quality-trigger"
                    type="button"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-describedby="auth-note"
                    popovertarget="quality-menu"
                    disabled
                  >
                    <span id="quality-trigger-label" class="quality-trigger-label">读取中…</span>
                    <svg class="quality-caret" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <div id="quality-menu" class="quality-menu" popover role="listbox" aria-label="缓存画质"></div>
                </div>
              </div>

              <div class="quality-row"><span class="quality-label">缓存大小</span><span id="cache-size" class="cache-size" aria-live="polite">正在估算…</span></div>
              <p id="auth-note" class="auth-note" hidden></p>
            </div>

            <button id="cache-button" class="cache-button" type="button" disabled aria-describedby="action-hint">
              <span id="button-progress" class="button-progress" aria-hidden="true"></span>
              <span class="button-content">
                <span id="button-label" class="button-label">读取页面</span>
                <span id="button-speed" class="button-speed"></span>
              </span>
            </button>
            <p id="action-hint" class="action-hint" role="status" aria-live="polite" hidden></p>
          </section>
        </section>

        <section id="assist-view" class="panel-view" role="tabpanel" aria-labelledby="assist-tab" hidden>
          <section id="assist-panel" class="assist-panel" aria-labelledby="assist-heading" hidden>
            <div class="assist-heading-row">
              <div>
                <p class="section-kicker">播放页面</p>
                <h2 id="assist-heading">提前加载</h2>
              </div>
              <button id="assist-toggle" class="assist-toggle" type="button" role="switch" aria-checked="false" aria-describedby="assist-status">
                <span class="assist-toggle-track" aria-hidden="true"><span></span></span>
                <span id="assist-toggle-label">关闭</span>
              </button>
            </div>
            <p id="assist-status" class="assist-status" role="status" aria-live="polite">等待视频加载</p>
            <details class="assist-settings">
              <summary>
                <span>高亮颜色</span>
                <span class="settings-summary-trailing">
                  <span id="assist-color-preview" class="assist-color-preview" aria-hidden="true"></span>
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </summary>
              <div class="assist-color-row">
                <div id="assist-colors" class="assist-color-palette" role="radiogroup" aria-label="提前加载高亮颜色"></div>
                <label id="assist-custom-color-shell" class="assist-custom-color" title="选择自定义高亮颜色">
                  <input id="assist-custom-color" type="color" value="#ff8a1f" aria-label="自定义提前加载高亮颜色">
                  <span>自定义</span>
                </label>
              </div>
            </details>
          </section>
        </section>

        <section id="library-view" class="panel-view" role="tabpanel" aria-labelledby="library-tab" hidden>
          <section class="library" aria-labelledby="library-heading">
            <div class="section-heading library-heading">
              <div>
                <p class="section-kicker">设备本地</p>
                <h2 id="library-heading">片库</h2>
              </div>
              <span id="library-summary" class="library-summary">0 B</span>
            </div>
            <div id="video-list" class="video-list" aria-live="polite"></div>
          </section>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
