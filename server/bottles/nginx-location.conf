# 放进 kihara.cn 的 443 server 块（/etc/nginx/sites-enabled/public-entry），位于 `location /` 之前。
# 需要在 http 块里先有限流区（见 nginx-limit.conf）。
location ^~ /haineicunzhi/api/ {
    # 官网承诺不做统计：这个路径不写访问日志，计数服务自己也不记日志、不存原始 IP。
    access_log off;
    # 限流拒绝会以 error 级别连同客户端 IP 写进错误日志；这里只留 crit，避免借道错误日志记下访客 IP。
    error_log /var/log/nginx/error.log crit;
    # 每个 IP 每分钟最多 20 次（读计数也算），突发 10 次，超出返回 429。
    limit_req zone=haineicunzhi_bottles burst=10 nodelay;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:18710;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}
