server {
    listen 80;
    listen [::]:80;
    server_name bilibili.kihara.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bilibili-acme;
        default_type text/plain;
    }
    location / { return 301 https://bilibili.kihara.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bilibili.kihara.cn;
    ssl_certificate /etc/letsencrypt/live/bilibili.kihara.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilibili.kihara.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/hsts.conf;

    # 先过独立站点认证，再接触服务端保存的 B 站账号。
    auth_basic "Bilibili private engine";
    auth_basic_user_file /etc/nginx/bilibili-content.htpasswd;
    client_max_body_size 2m;
    # 媒体与登录 URL 是短期凭证，禁止进入访问日志。
    access_log off;
    error_log /var/log/nginx/bilibili-content-error.log crit;

    location / {
        proxy_pass http://127.0.0.1:18711;
        proxy_http_version 1.1;
        # 引擎保留回环 Host 栅栏；浏览器原始 Origin 继续交由引擎精确验证。
        proxy_set_header Host 127.0.0.1:18711;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
