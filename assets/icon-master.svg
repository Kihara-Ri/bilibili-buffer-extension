<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Bili 缓冲站图标</title>
  <desc id="desc">透明背景上的蓝色圆角电视，屏幕内有粉色缓存进度和播放三角</desc>
  <!--
    128 画布内只画 96×96 的图形，四周各留 16 像素完全透明。
    这是 Chrome 图标规范的要求（方形图标 artwork 96×96 + 16 像素透明边距）：
    工具栏图标会叠在深色或彩色底上，任何不透明底色都会变成一块突兀的方块。
  -->
  <g transform="translate(16 18)">
    <path d="M27 5 38 15M69 5 58 15" fill="none" stroke="#176b87" stroke-width="7" stroke-linecap="round"/>
    <rect x="0" y="12" width="96" height="72" rx="24" fill="#13a9df"/>
    <rect x="8" y="20" width="80" height="48" rx="14" fill="#f7fcff"/>
    <path d="M39 26 61 39 39 52Z" fill="#fb7299"/>
    <path d="M18 60h60" fill="none" stroke="#cceef9" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 60h30" fill="none" stroke="#fb7299" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="60" r="3.5" fill="#176b87"/>
    <path d="M22 84v3M74 84v3" fill="none" stroke="#176b87" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
