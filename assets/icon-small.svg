<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Bili 缓冲站小尺寸图标</title>
  <desc id="desc">透明背景上的蓝色圆角电视，白色播放三角与粉色缓存进度条</desc>
  <!--
    16/32 像素下细描边会被抗锯齿抹平，所以这一版去掉天线、指示灯和进度槽，
    只保留“蓝色机身 + 白色播放三角 + 粉色进度条”三个大色块，
    与 128 版保持同一套识别特征。四周同样留透明边距，避免变成方块底。
  -->
  <rect x="3" y="4.5" width="26" height="23" rx="7" fill="#13a9df"/>
  <path d="M12 10.5 22 15.5 12 20.5Z" fill="#f7fcff"/>
  <rect x="6.5" y="21.5" width="19" height="3.5" rx="1.75" fill="#fb7299"/>
</svg>
