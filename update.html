<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitHub 更新 · 海内存知</title><link rel="stylesheet" href="update.css"></head>
<body><main>
  <header><img src="assets/icon-48.png" width="42" height="42" alt=""><div><p class="eyebrow">海内存知 · GitHub</p><h1 data-i18n="update.title">扩展更新</h1></div></header>
  <p class="intro" data-i18n="update.intro">在扩展内更新，保留当前安装身份与本地缓存。请保持 Chrome 的开发者模式开启。</p>
  <section class="versions"><span data-i18n="update.current">当前版本</span><strong id="current-version">—</strong><span data-i18n="update.latest">可用版本</span><strong id="latest-version">—</strong></section>
  <section class="directory"><h2 data-i18n="update.directory">安装目录</h2><p data-i18n="update.directoryHint">首次选择“加载已解压的扩展程序”时使用的目录。后续更新时，Chrome 可能再次要求确认写入权限。</p><div class="directory-row"><span id="directory-name" data-i18n="update.unbound">尚未选择目录</span><button id="bind" type="button" data-i18n="update.choose">选择目录</button></div></section>
  <label class="refresh"><input id="refresh-tabs" type="checkbox" checked><span data-i18n="update.refresh">更新成功后刷新已打开的 B 站视频页，让页面使用新版本</span></label>
  <div class="actions"><button id="check" type="button" data-i18n="update.check">检查更新</button><button id="install" class="primary" type="button" disabled data-i18n="update.install">更新并重载</button><button id="recover" type="button" hidden data-i18n="update.recover">恢复更新前的文件</button><button id="cancel" type="button" hidden data-i18n="update.cancel">取消未写入的更新</button></div>
  <p id="status" role="status" aria-live="polite" data-state="loading"></p>
  <p class="footnote" data-i18n="update.note">更新前会暂停缓存任务并备份文件。只有新版本通过检查后才恢复任务。请勿在写入期间关闭本页。</p>
  <a href="https://github.com/Kihara-Ri/bilibili-buffer-extension/releases" target="_blank" rel="noopener noreferrer" data-i18n="update.manual">打开 GitHub 下载页</a>
</main><script type="module" src="src/github-updater-page.js"></script></body></html>
