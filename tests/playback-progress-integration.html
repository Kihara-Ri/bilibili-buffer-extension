<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>预热进度条集成测试</title>
    <style>
      body { background: #202124; color: #eef4f8; font: 14px sans-serif; padding: 24px; }
      .bpx-player-progress,
      .bpx-player-shadow-progress-area { position: relative; width: 620px; height: 4px; }
      .bpx-player-progress-schedule-wrap,
      .bpx-player-shadow-progress-schedule-wrap,
      .bpx-player-progress-schedule { position: absolute; inset: 0; overflow: hidden; }
      .bpx-player-progress.segmented > .bpx-player-progress-schedule-wrap { right: auto; }
      .bpx-player-progress.segmented > .bpx-player-progress-schedule-wrap:nth-child(1) { left: 0; width: 180px; }
      .bpx-player-progress.segmented > .bpx-player-progress-schedule-wrap:nth-child(2) { left: 190px; width: 240px; }
      .bpx-player-progress.segmented > .bpx-player-progress-schedule-wrap:nth-child(3) { left: 440px; width: 180px; }
      .bpx-player-progress-schedule { background: rgba(255, 255, 255, 0.2); }
      .bpx-player-progress-schedule-buffer { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.3); transform: scaleX(0.7); transform-origin: left; }
      .bpx-player-progress-schedule-current { position: absolute; inset: 0; z-index: 99; background: #ff6699; transform: scaleX(0.08); transform-origin: left; }
      .bpx-player-shadow-progress-area { height: 2px; margin-top: 24px; }
      .bpx-player-progress-schedule { border-radius: 2px; }
      .bpx-player-progress:hover { height: 6px; }
      .bpx-player-progress-thumb { position: absolute; left: 150px; top: -6px; width: 18px; height: 14px; background: #eeeeee; border: 2px solid #00a1d6; border-radius: 3px; z-index: 100; }
      .bpx-player-progress-thumb::before { content: "TV"; color: #202124; font-size: 9px; }
      #result { margin-top: 24px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <video id="test-video" hidden></video>
    <div class="bpx-player-progress segmented">
      <div class="bpx-player-progress-schedule-wrap">
        <div class="bpx-player-progress-schedule">
          <div class="bpx-player-progress-schedule-buffer"></div>
          <div class="bpx-player-progress-schedule-current"></div>
        </div>
      </div>
      <div class="bpx-player-progress-schedule-wrap">
        <div class="bpx-player-progress-schedule"><div class="bpx-player-progress-schedule-buffer"></div><div class="bpx-player-progress-schedule-current"></div></div>
      </div>
      <div class="bpx-player-progress-schedule-wrap">
        <div class="bpx-player-progress-schedule"><div class="bpx-player-progress-schedule-buffer"></div><div class="bpx-player-progress-schedule-current"></div></div>
      </div>
      <div class="bpx-player-progress-thumb" role="slider" tabindex="0" aria-label="原生小电视"></div>
    </div>
    <div class="bpx-player-shadow-progress-area">
      <div class="bpx-player-shadow-progress-schedule-wrap">
        <div class="bpx-player-progress-schedule"><div class="bpx-player-progress-schedule-buffer"></div><div class="bpx-player-progress-schedule-current"></div></div>
      </div>
    </div>
    <pre id="result">running</pre>
    <script type="module" src="./playback-progress-integration.mjs"></script>
  </body>
</html>
