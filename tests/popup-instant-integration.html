<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popup 首屏恢复测试</title>
    <link rel="stylesheet" href="../popup.css">
  </head>
  <body>
    <main class="app-shell">
      <h2 id="current-heading">正在识别视频</h2>
      <a id="current-owner" href="#" hidden></a>
      <span id="current-detail-separator" hidden></span>
      <span id="current-detail-text">请稍候…</span>
      <span id="page-mark" hidden></span>
      <div id="quality-row" hidden>
        <button id="quality-trigger" type="button" popovertarget="quality-menu" disabled>
          <span id="quality-trigger-label">正在读取可用画质…</span>
        </button>
        <div id="quality-menu" popover></div>
      </div>
      <div id="codec-row" hidden><div id="codec-options"></div></div>
      <p id="auth-note" hidden></p>
      <button id="cache-button" type="button" disabled>
        <span id="button-progress"></span>
        <span id="button-label">正在读取页面</span>
        <span id="button-speed"></span>
      </button>
      <p id="action-hint"></p>
      <section id="assist-panel" class="assist-panel" hidden>
        <span id="assist-status"></span>
        <div id="assist-modes" class="choice-strip assist-modes">
          <button data-assist-mode="observe"></button>
          <button data-assist-mode="auto"></button>
          <button data-assist-mode="always"></button>
          <button data-assist-mode="off"></button>
        </div>
        <div class="assist-color-row">
          <span class="assist-color-label">高亮颜色</span>
          <div id="assist-colors" class="assist-color-palette"></div>
          <label id="assist-custom-color-shell" class="assist-custom-color">
            <input id="assist-custom-color" type="color" value="#ff8a1f">
            <span>自定</span>
          </label>
        </div>
        <span id="assist-ttfb"></span>
        <span id="assist-slow"></span>
        <span id="assist-buffer"></span>
        <span id="assist-prefetch"></span>
        <div id="estimator-row" hidden>
          <span id="estimator-note"></span>
          <button id="estimator-clear"></button>
          <button id="estimator-restore"></button>
        </div>
      </section>
      <span id="library-summary"></span>
      <div id="video-list"></div>
      <div id="toast"></div>
    </main>
    <pre id="result">running</pre>
    <script type="module" src="./popup-instant-integration.mjs"></script>
  </body>
</html>
