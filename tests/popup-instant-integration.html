<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popup 分层界面测试</title>
    <link rel="stylesheet" href="../popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand-lockup">
          <img class="brand-icon" src="../assets/icon-48.png" alt="">
          <h1>Bili 缓冲站</h1>
        </div>
      </header>

      <nav id="panel-tabs" class="panel-tabs" role="tablist" aria-label="插件面板">
        <button id="cache-tab" type="button" role="tab" data-panel-view="cache" aria-controls="cache-view" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>缓存</span>
        </button>
        <button id="assist-tab" type="button" role="tab" data-panel-view="assist" aria-controls="assist-view" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v3m4-7v7m4-11v11m4-14v14m4-9v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>播放</span>
          <span id="assist-tab-indicator" class="tab-indicator" aria-hidden="true"></span>
        </button>
        <button id="library-tab" type="button" role="tab" data-panel-view="library" aria-controls="library-view" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v13H5zM8.5 5.5v13M12 9h4m-4 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>片库</span>
          <span id="library-count" class="tab-count">0</span>
        </button>
      </nav>

      <div class="panel-stack">
        <section id="cache-view" class="panel-view" role="tabpanel" aria-labelledby="cache-tab">
          <section class="current-video" aria-labelledby="current-heading">
            <div class="section-heading">
              <div>
                <p class="section-kicker">当前视频</p>
                <h2 id="current-heading">正在识别视频</h2>
              </div>
              <span id="page-mark" class="page-mark" hidden></span>
            </div>
            <p id="current-detail" class="current-detail">
              <a id="current-owner" class="current-owner" href="#" hidden></a>
              <span id="current-detail-separator" hidden> · </span>
              <span id="current-detail-text">请稍候…</span>
            </p>
            <div id="format-controls" class="format-controls" hidden>
              <div id="quality-row" class="quality-row" hidden>
                <span class="quality-label">画质</span>
                <div class="quality-picker">
                  <button id="quality-trigger" class="quality-trigger" type="button" popovertarget="quality-menu" disabled>
                    <span id="quality-trigger-label" class="quality-trigger-label">读取中…</span>
                    <svg class="quality-caret" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <div id="quality-menu" class="quality-menu" popover></div>
                </div>
              </div>
              <div id="codec-row" class="codec-row" hidden>
                <span class="quality-label">编码</span>
                <div id="codec-options" class="choice-strip"></div>
              </div>
              <p id="auth-note" class="auth-note" hidden></p>
            </div>
            <button id="cache-button" class="cache-button" type="button" disabled>
              <span id="button-progress" class="button-progress"></span>
              <span class="button-content">
                <span id="button-label" class="button-label">读取页面</span>
                <span id="button-speed" class="button-speed"></span>
              </span>
            </button>
            <p id="action-hint" class="action-hint" hidden></p>
          </section>
        </section>

        <section id="assist-view" class="panel-view" role="tabpanel" aria-labelledby="assist-tab" hidden>
          <section id="assist-panel" class="assist-panel" hidden>
            <div class="assist-heading-row">
              <div><p class="section-kicker">播放网络</p><h2>播放优化</h2></div>
              <span id="assist-status" class="assist-status"></span>
            </div>
            <div id="assist-modes" class="choice-strip assist-modes">
              <button data-assist-mode="observe">观察</button>
              <button data-assist-mode="auto">自动</button>
              <button data-assist-mode="always">持续</button>
              <button data-assist-mode="off">关闭</button>
            </div>
            <div class="assist-metrics">
              <span><small>延迟 P95</small><strong id="assist-ttfb"></strong></span>
              <span><small>高延迟</small><strong id="assist-slow"></strong></span>
              <span><small>播放余量</small><strong id="assist-buffer"></strong></span>
              <span><small>CDN 预取</small><strong id="assist-prefetch"></strong></span>
            </div>
            <details class="assist-settings">
              <summary><span>进度条高亮</span><span class="settings-summary-trailing"><span id="assist-color-preview" class="assist-color-preview"></span><svg viewBox="0 0 20 20"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span></summary>
              <div class="assist-color-row">
                <div id="assist-colors" class="assist-color-palette"></div>
                <label id="assist-custom-color-shell" class="assist-custom-color"><input id="assist-custom-color" type="color" value="#ff8a1f"><span>自定义</span></label>
              </div>
            </details>
            <div id="estimator-row" class="estimator-row" hidden>
              <span id="estimator-note"></span>
              <div><button id="estimator-clear"></button><button id="estimator-restore"></button></div>
            </div>
          </section>
        </section>

        <section id="library-view" class="panel-view" role="tabpanel" aria-labelledby="library-tab" hidden>
          <section class="library">
            <div class="section-heading library-heading">
              <div><p class="section-kicker">设备本地</p><h2>片库</h2></div>
              <span id="library-summary" class="library-summary"></span>
            </div>
            <div id="video-list" class="video-list"></div>
          </section>
        </section>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <pre id="result" hidden>running</pre>
    <script type="module" src="./popup-instant-integration.mjs"></script>
  </body>
</html>
